<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f7a4c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recarga" />
    <title>CompactRecarga</title>
    <script>
      // App do motorista (/app e o QR /c/...): manifest proprio, que abre no
      // mapa, e a cor escura. Precisa estar antes do navegador ler o manifest.
      if (/^\/(app|c)(\/|$)/.test(location.pathname)) {
        document.querySelector('link[rel="manifest"]').href = "/manifest-motorista.webmanifest";
        document.querySelector('meta[name="theme-color"]').content = "#070d0b";
        var barra = document.createElement("meta");
        barra.name = "apple-mobile-web-app-status-bar-style";
        barra.content = "black-translucent";
        document.head.appendChild(barra);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
