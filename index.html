<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070d0b" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recarga" />
    <title>CompactRecarga</title>
    <script>
      // O site instala como app do motorista (manifest.webmanifest abre no
      // /app). So as telas do painel trocam para o manifest do painel, para o
      // app instalado nunca cair no login do painel.
      if (/^\/(login|dashboard|carregadores|sessoes|diagnostico|clientes|mapa|gestao|whatsapp|usuarios|quedas|saude|ao-vivo)(\/|$)/.test(location.pathname)) {
        document.querySelector('link[rel="manifest"]').href = "/manifest-painel.webmanifest";
        document.querySelector('meta[name="theme-color"]').content = "#1f7a4c";
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = "default";
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "Painel";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
